[project]
name = "dialogue-agent"
version = "0.1.0"
description = "Conversational Expert agent to gather information from users for various services across domains."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.75.0",
    "google-adk>=1.21.0",
    "google-genai>=1.55.0",
    "litellm>=1.80.9",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.scripts]
debug = "adk web src/agents"

