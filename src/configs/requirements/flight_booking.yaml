requirements:
  - title: Travel Itinerary
    description: Core flight itinerary details
    questions:
      - id: origin_city
        question: What is your departure city or airport?
        response_guidelines:
          acceptance_criteria:
            - Must be a valid city name
            - Must not be empty
          followup_questions:
            - condition: invalid_city_or_airport
              question: Please provide a valid city name or airport code (e.g., NYC, DEL).

      - id: destination_city
        question: What city or airport are you flying to?
        response_guidelines:
          acceptance_criteria:
            - Must be a valid city name
            - Must be different from origin_city
          followup_questions:
            - condition: same_as_origin
              question: Destination cannot be the same as departure. Please confirm a different destination.

